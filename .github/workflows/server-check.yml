name: 'Check Neptun WebServers'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 */3 * *'

permissions:
  contents: write

jobs:
  server-check:
    runs-on: ubuntu-24.04
    concurrency:
      group: server-check
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate configured servers
        id: validate
        continue-on-error: true
        run: npm run server-check:validate -- --json-output=validate-results.json

      - name: Evaluate validation pass rate
        id: evaluate
        if: always()
        run: node src/scripts/evaluate-server-check.mjs

      - name: Discover additional servers
        id: discover
        if: always()
        continue-on-error: true
        run: npm run server-check:discover -- --json-output=discovery-results.json

      - name: Add discovered servers
        id: update
        if: always()
        shell: bash
        run: |
          if [[ ! -f discovery-results.json ]]; then
            echo "Discovery did not produce results; no university data was changed."
            exit 0
          fi

          node src/scripts/update-discovered-servers.mjs

          if git diff --quiet -- src/data/universities.json; then
            echo "No new servers to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/universities.json
          git commit -m "chore: add discovered Neptun servers"
          git push

      - name: Publish server check report
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          DISCOVER_OUTCOME: ${{ steps.discover.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: node src/scripts/create-server-check-report.mjs

      - name: Fail if checks did not pass
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.evaluate.outputs.passed }}" != "true" || "${{ steps.validate.outcome }}" != "success" || "${{ steps.discover.outcome }}" != "success" || "${{ steps.update.outcome }}" != "success" ]]; then
            exit 1
          fi
