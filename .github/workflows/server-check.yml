name: 'Check Neptun WebServers'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 */3 * *'

permissions:
  contents: write

concurrency:
  group: server-check
  cancel-in-progress: false

jobs:
  validate:
    name: Validate configured servers
    runs-on: ubuntu-24.04
    outputs:
      outcome: ${{ steps.validate.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate configured servers
        id: validate
        continue-on-error: true
        run: npm run server-check:validate -- --json-output=validate-results.json

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-results
          path: validate-results.json
          if-no-files-found: ignore

  evaluate:
    name: Evaluate validation pass rate
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.evaluate.outputs.passed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download validation results
        uses: actions/download-artifact@v5
        with:
          name: validate-results

      - name: Evaluate validation pass rate
        id: evaluate
        run: node src/scripts/evaluate-server-check.mjs

  discover:
    name: Discover additional servers
    needs: evaluate
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      outcome: ${{ steps.discover.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Discover additional servers
        id: discover
        continue-on-error: true
        run: npm run server-check:discover -- --json-output=discovery-results.json

      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results
          path: discovery-results.json
          if-no-files-found: ignore

  update:
    name: Add discovered servers
    needs: discover
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download discovery results
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: discovery-results

      - name: Add discovered servers
        shell: bash
        run: |
          if [[ ! -f discovery-results.json ]]; then
            echo "Discovery did not produce results; no university data was changed."
            exit 0
          fi

          node src/scripts/update-discovered-servers.mjs

          if git diff --quiet -- src/data/universities.json; then
            echo "No new servers to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/universities.json
          git commit -m "chore: add discovered Neptun servers"
          git push

  report:
    name: Publish server check report
    needs: [validate, evaluate, discover, update]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download validation results
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: validate-results

      - name: Download discovery results
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: discovery-results

      - name: Publish server check report
        run: node src/scripts/create-server-check-report.mjs

  finish:
    name: Check server-check result
    needs: [validate, evaluate, discover, update, report]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Fail if checks did not pass
        shell: bash
        run: |
          if [[ "${{ needs.evaluate.outputs.passed }}" != "true" || "${{ needs.validate.outputs.outcome }}" != "success" || "${{ needs.discover.outputs.outcome }}" != "success" || "${{ needs.update.result }}" != "success" ]]; then
            exit 1
          fi
